name: Moth Watch regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  userscript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/moth-watch-automation.test.cjs
