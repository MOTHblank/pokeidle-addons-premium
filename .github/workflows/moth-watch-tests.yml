name: Premium addons regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  userscript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-mothwatch.cjs --check
      - run: node --check addons/market-bot.user.js
      - run: node --test tests/moth-watch-automation.test.cjs
      - run: node --test huntatlas/tests/*.test.cjs
