name: Premium addon checks

on:
  push:
    branches: [main]
    paths:
      - 'addons/**'
      - '.github/workflows/premium-checks.yml'
  pull_request:
    paths:
      - 'addons/**'
      - '.github/workflows/premium-checks.yml'
  workflow_dispatch:

jobs:
  addon-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify MothWatch standalone bundle
        run: node addons/moth-watch/build.cjs --check
      - name: Check userscript syntax
        run: |
          node --check addons/moth-watch/moth-watch.user.js
          node --check addons/hunt-atlas/hunt-atlas.user.js
          node --check addons/upstream-scraper/scraper-exporter.user.js
      - name: Run MothWatch regressions
        run: node --test addons/moth-watch/tests/automation.test.cjs
