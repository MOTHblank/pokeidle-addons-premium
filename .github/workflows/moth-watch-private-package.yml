name: Private MothWatch userscript package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone userscript
        run: |
          node tools/build-mothwatch.cjs --check
          node --check addons/market-bot.user.js
          node --test tests/moth-watch-automation.test.cjs
      - name: Package single-file Violentmonkey installation
        run: |
          mkdir -p dist
          cp addons/market-bot.user.js dist/moth-watch.user.js
      - uses: actions/upload-artifact@v4
        with:
          name: moth-watch-private-${{ github.run_number }}
          path: dist/moth-watch.user.js
          retention-days: 14
          if-no-files-found: error
