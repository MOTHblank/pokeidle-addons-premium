name: MothWatch userscript package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package single-file Violentmonkey installation
        run: |
          mkdir -p dist
          cp addons/moth-watch/moth-watch.user.js dist/moth-watch.user.js
      - uses: actions/upload-artifact@v4
        with:
          name: moth-watch-private-${{ github.run_number }}
          path: dist/moth-watch.user.js
          retention-days: 14
          if-no-files-found: error
